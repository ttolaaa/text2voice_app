name: text2voice # fixed project name, whatever the folder is called (keeps deploy.sh and manual commands in sync)

services:
  text2voice:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: text2voice:latest
    container_name: text2voice
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Optional Azure AI Speech voices (put these in a .env file next to this compose file).
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      # "My Voice" cloning service on the private compose network. Set to empty to disable.
      CLONE_URL: ${CLONE_URL-http://voice-clone:8000}
      # 1 when running behind the bundled Caddy (or another) reverse proxy, so rate limits see real client IPs.
      TRUST_PROXY: ${TRUST_PROXY:-0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  voice-clone:
    build:
      context: ./voice-clone
    image: text2voice-voice-clone:latest
    container_name: text2voice-voice-clone
    # Not published: only reachable by the app over the internal network.
    expose:
      - "8000"
    environment:
      DEVICE: ${CLONE_DEVICE:-auto}
      CLONE_MODEL: ${CLONE_MODEL:-turbo}
    volumes:
      - clone-models:/models # Chatterbox weights (~3 GB), downloaded on first start
      - clone-voices:/data/voices # users' cloned voices
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Optional automatic HTTPS (Let's Encrypt). Enable with COMPOSE_PROFILES=https and DOMAIN=your.domain in .env.
  caddy:
    image: caddy:2-alpine
    container_name: text2voice-caddy
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates
      - caddy-config:/config
    depends_on:
      - text2voice
    restart: unless-stopped

volumes:
  clone-models:
  clone-voices:
  caddy-data:
  caddy-config:
